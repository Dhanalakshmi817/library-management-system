<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(rgba(0, 0, 0, 0.60),
                    rgba(0, 0, 0, 0.60)),
                url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2000&q=90");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        /* NAVBAR */

        .navbar {
            height: 78px;
            background: rgba(10, 10, 15, 0.96);

            display: flex;
            align-items: center;

            padding: 0 45px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);

            position: relative;
            z-index: 10;
        }

        .navbar h2 {
            color: #ffffff;
            margin-right: auto;

            font-size: 25px;
            letter-spacing: 1px;

            text-shadow: 0 0 10px rgba(255, 193, 7, 0.4);
        }

        .navbar a {
            color: #dddddd;
            text-decoration: none;

            padding: 12px 20px;
            margin-left: 8px;

            font-weight: bold;
            font-size: 15px;

            border-radius: 8px;

            transition: 0.3s;
        }

        .navbar a:hover {
            color: #ffffff;
            background: #252530;

            box-shadow: 0 0 15px rgba(255, 193, 7, 0.25);

            transform: translateY(-2px);
        }

        /* HERO */

        .hero {
            min-height: calc(100vh - 75px);

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px 20px;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero h1 {
            font-size: 58px;
            margin-bottom: 20px;
            color: #f2b84b;
            text-shadow: 2px 2px 5px #000;
        }

        .hero h2 {
            font-size: 30px;
            margin-bottom: 20px;
            color: white;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.7;
            color: #eeeeee;
            margin-bottom: 35px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 15px 35px;

            border-radius: 30px;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            transition: 0.3s;
        }

        .login-btn {
            background: #8b4dff;
            color: white;
        }

        .register-btn {
            background: #f2b84b;
            color: #222;
        }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        /* FEATURES */

        .features {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;

            margin-top: 50px;
        }

        .feature {
            width: 200px;

            padding: 20px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 12px;

            backdrop-filter: blur(5px);
        }

        .feature h3 {
            color: #f2b84b;
            margin-bottom: 8px;
        }

        .feature p {
            font-size: 14px;
            margin: 0;
            color: #eee;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .navbar {
                height: auto;
                padding: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .navbar h2 {
                width: 100%;
                text-align: center;
                margin-bottom: 10px;
            }

            .navbar a {
                padding: 10px 12px;
                font-size: 14px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .hero h2 {
                font-size: 23px;
            }

            .hero p {
                font-size: 16px;
            }
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <h2>📚 LIBRARY</h2>

        <a href="/">HOME</a>

        <a href="/login">LOGIN</a>

        <a href="/register">REGISTER</a>

    </div>


    <!-- HERO SECTION -->

    <section class="hero">

        <div class="hero-content">

            <h1>📚 Library Management System</h1>

            <h2>Welcome to Our Digital Library</h2>

            <p>
                Manage books, students, issue and return records
                easily with our simple Library Management System.
            </p>


            <!-- BUTTONS -->

            <div class="buttons">

                <a href="/login" class="btn login-btn">
                    🔐 Login
                </a>

                <a href="/register" class="btn register-btn">
                    📝 Register
                </a>

            </div>

    </section>

</body>

</html>
