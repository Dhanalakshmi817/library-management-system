<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Library Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           SAME LIBRARY BACKGROUND
        ========================= */

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: white;

            overflow: hidden;

            background: #111;
        }


        body::before {

            content: "";

            position: fixed;

            inset: -10px;

            background:
                url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2000&q=90");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            filter: blur(2.5px);

            transform: scale(1.03);

            z-index: -3;
        }


        body::after {

            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.42),
                    rgba(0, 0, 0, 0.50)
                );

            z-index: -2;
        }


        /* =========================
           CENTER
        ========================= */

        .login-page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;
        }


        /* =========================
           NEW TRENDY LOGIN CARD
        ========================= */

        .login-card {

            width: 430px;

            padding: 38px 40px 32px;

            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(8, 25, 38, 0.94),
                    rgba(4, 15, 25, 0.91)
                );

            border: 1px solid
                rgba(255,255,255,0.18);

            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.70),
                inset 0 1px 0
                rgba(255,255,255,0.08);

            backdrop-filter: blur(18px);
        }


        /* TOP GLOW */

        .login-card::before {

            content: "";

            position: absolute;

            top: -1px;

            left: 15%;

            width: 70%;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #4fc3f7,
                    transparent
                );

            box-shadow:
                0 0 18px #4fc3f7;
        }


        /* =========================
           ICON
        ========================= */

        .icon-box {

            width: 72px;

            height: 72px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(79,195,247,0.20),
                    rgba(79,195,247,0.05)
                );

            border:
                1px solid
                rgba(79,195,247,0.40);

            box-shadow:
                0 10px 30px
                rgba(79,195,247,0.12);
        }


        /* =========================
           TITLE
        ========================= */

        .title {

            text-align: center;

            font-size: 30px;

            font-weight: 700;

            color: #ffffff;

            margin-bottom: 8px;

            letter-spacing: 0.3px;
        }


        .title span {

            color: #4fc3f7;

            text-shadow:
                0 0 15px
                rgba(79,195,247,0.35);
        }


        .subtitle {

            text-align: center;

            color: #9fb2bc;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 28px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #dce7eb;

            font-size: 13px;

            font-weight: 600;
        }


        /* INPUT WRAPPER */

        .input-box {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            opacity: 0.75;
        }


        input {

            width: 100%;

            height: 48px;

            padding: 0 15px 0 45px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255,255,255,0.14);

            outline: none;

            background:
                rgba(255,255,255,0.055);

            color: white;

            font-size: 14px;

            transition: 0.3s;
        }


        input::placeholder {

            color: #728791;
        }


        input:hover {

            border-color:
                rgba(79,195,247,0.35);
        }


        input:focus {

            background:
                rgba(79,195,247,0.07);

            border-color: #4fc3f7;

            box-shadow:
                0 0 0 3px
                rgba(79,195,247,0.08);
        }


        /* =========================
           REMEMBER / FORGOT
        ========================= */

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 5px 0 22px;

            font-size: 12px;
        }


        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #9fb2bc;
        }


        .remember input {

            width: 14px;

            height: 14px;

            accent-color: #4fc3f7;

            padding: 0;
        }


        .forgot {

            color: #4fc3f7;

            text-decoration: none;
        }


        .forgot:hover {

            text-decoration: underline;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            color: #061521;

            font-size: 15px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #64d5ff,
                    #2196d3
                );

            box-shadow:
                0 10px 25px
                rgba(33,150,211,0.28);

            transition: all 0.3s ease;
        }


        .login-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 32px
                rgba(33,150,211,0.42);
        }


        .login-button:active {

            transform: translateY(0);
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0 20px;

            color: #657982;

            font-size: 11px;
        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            flex: 1;

            background:
                rgba(255,255,255,0.10);
        }


        /* =========================
           REGISTER
        ========================= */

        .register {

            text-align: center;

            font-size: 13px;

            color: #94a9b2;
        }


        .register a {

            color: #4fc3f7;

            font-weight: 600;

            text-decoration: none;

            margin-left: 4px;
        }


        .register a:hover {

            text-decoration: underline;
        }


        /* =========================
           BACK HOME
        ========================= */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #8297a1;

            font-size: 12px;

            text-decoration: none;

            transition: 0.3s;
        }


        .back-home:hover {

            color: #4fc3f7;
        }


        /* =========================
           SECURITY
        ========================= */

        .secure {

            text-align: center;

            margin-top: 20px;

            padding-top: 15px;

            border-top:
                1px solid
                rgba(255,255,255,0.07);

            color: #627781;

            font-size: 10px;

            letter-spacing: 0.3px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .login-card {

                width: 100%;

                padding: 32px 24px 28px;

                border-radius: 20px;
            }


            .title {

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="login-page">


    <div class="login-card">


        <!-- ICON -->

        <div class="icon-box">

            📚

        </div>


        <!-- TITLE -->

        <h1 class="title">

            Library <span>Login</span>

        </h1>


        <p class="subtitle">

            Welcome back! Sign in to access your
            library management dashboard.

        </p>


        <!-- FORM -->

        <form method="POST" action="/login">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">

                    Username

                </label>


                <div class="input-box">

                    <span class="input-icon">

                        👤

                    </span>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <div class="input-box">

                    <span class="input-icon">

                        🔒

                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="options">


                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>


                <a
                    href="#"
                    class="forgot">

                    Forgot password?

                </a>


            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-button">

                Login to Library &nbsp; →

            </button>


        </form>


        <!-- DIVIDER -->

        <div class="divider">

            OR

        </div>


        <!-- REGISTER -->

        <div class="register">

            New to the library?

            <a href="/register">

                Create an account

            </a>

        </div>


        <!-- HOME -->

        <a
            href="/"
            class="back-home">

            ← Back to Home

        </a>


        <!-- SECURITY -->

        <div class="secure">

            🔒 &nbsp; Secure Library Management Portal

        </div>


    </div>


</div>


</body>

</html>
