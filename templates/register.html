<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Library Management System</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           LIBRARY BACKGROUND
        ========================= */

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: white;

            overflow: hidden;

            background: #111;
        }


        body::before {

            content: "";

            position: fixed;

            inset: -10px;

            background:
                url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2000&q=90");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            filter: blur(2.5px);

            transform: scale(1.03);

            z-index: -3;
        }


        /* DARK OVERLAY */

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.42),
                    rgba(0, 0, 0, 0.50)
                );

            z-index: -2;
        }


        /* =========================
           CENTER
        ========================= */

        .register-page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow-y: auto;
        }


        /* =========================
           REGISTER CARD
        ========================= */

        .register-card {

            width: 460px;

            padding: 32px 40px 28px;

            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(8, 25, 38, 0.95),
                    rgba(4, 15, 25, 0.92)
                );

            border:
                1px solid rgba(255,255,255,0.18);

            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.70),
                inset 0 1px 0
                rgba(255,255,255,0.08);

            backdrop-filter: blur(18px);
        }


        /* TOP GLOW */

        .register-card::before {

            content: "";

            position: absolute;

            top: -1px;

            left: 15%;

            width: 70%;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #20c978,
                    transparent
                );

            box-shadow:
                0 0 18px #20c978;
        }


        /* =========================
           ICON
        ========================= */

        .icon-box {

            width: 68px;

            height: 68px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            border-radius: 19px;

            background:
                linear-gradient(
                    135deg,
                    rgba(32,201,120,0.20),
                    rgba(32,201,120,0.05)
                );

            border:
                1px solid
                rgba(32,201,120,0.40);

            box-shadow:
                0 10px 30px
                rgba(32,201,120,0.12);
        }


        /* =========================
           TITLE
        ========================= */

        .title {

            text-align: center;

            font-size: 29px;

            font-weight: 700;

            color: white;

            margin-bottom: 7px;
        }


        .title span {

            color: #20c978;

            text-shadow:
                0 0 15px
                rgba(32,201,120,0.35);
        }


        .subtitle {

            text-align: center;

            color: #9fb2bc;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 23px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 14px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #dce7eb;

            font-size: 13px;

            font-weight: 600;
        }


        .input-box {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 16px;

            opacity: 0.75;
        }


        input {

            width: 100%;

            height: 45px;

            padding: 0 14px 0 43px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.14);

            outline: none;

            background:
                rgba(255,255,255,0.055);

            color: white;

            font-size: 14px;

            transition: 0.3s;
        }


        input::placeholder {

            color: #728791;
        }


        input:hover {

            border-color:
                rgba(32,201,120,0.35);
        }


        input:focus {

            background:
                rgba(32,201,120,0.07);

            border-color: #20c978;

            box-shadow:
                0 0 0 3px
                rgba(32,201,120,0.08);
        }


        /* =========================
           TERMS
        ========================= */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin: 16px 0 19px;

            color: #8fa4ad;

            font-size: 11px;

            line-height: 1.5;
        }


        .terms input {

            width: 14px;

            height: 14px;

            margin-top: 1px;

            padding: 0;

            accent-color: #20c978;

            flex-shrink: 0;
        }


        .terms a {

            color: #20c978;

            text-decoration: none;
        }


        .terms a:hover {

            text-decoration: underline;
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-button {

            width: 100%;

            height: 49px;

            border: none;

            border-radius: 11px;

            cursor: pointer;

            color: #061a12;

            font-size: 15px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #43e49a,
                    #20b96e
                );

            box-shadow:
                0 10px 25px
                rgba(32,201,120,0.25);

            transition: all 0.3s ease;
        }


        .register-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 32px
                rgba(32,201,120,0.40);
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 20px 0 17px;

            color: #657982;

            font-size: 11px;
        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            flex: 1;

            background:
                rgba(255,255,255,0.10);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-text {

            text-align: center;

            font-size: 13px;

            color: #94a9b2;
        }


        .login-text a {

            color: #4fc3f7;

            font-weight: 600;

            text-decoration: none;

            margin-left: 4px;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        /* =========================
           BACK HOME
        ========================= */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #8297a1;

            font-size: 12px;

            text-decoration: none;

            transition: 0.3s;
        }


        .back-home:hover {

            color: #20c978;
        }


        /* =========================
           SECURITY
        ========================= */

        .secure {

            text-align: center;

            margin-top: 16px;

            padding-top: 13px;

            border-top:
                1px solid
                rgba(255,255,255,0.07);

            color: #627781;

            font-size: 10px;

            letter-spacing: 0.3px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .register-card {

                width: 100%;

                padding: 30px 23px 25px;

                border-radius: 20px;
            }


            .title {

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="register-page">


    <div class="register-card">


        <!-- ICON -->

        <div class="icon-box">

            📝

        </div>


        <!-- TITLE -->

        <h1 class="title">

            Create <span>Account</span>

        </h1>


        <p class="subtitle">

            Join the library and manage your books
            and records easily.

        </p>


        <!-- FORM -->

        <form
            method="POST"
            action="/register">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">

                    Username

                </label>


                <div class="input-box">

                    <span class="input-icon">

                        👤

                    </span>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>


                <div class="input-box">

                    <span class="input-icon">

                        ✉️

                    </span>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <div class="input-box">

                    <span class="input-icon">

                        🔒

                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">

                    Confirm Password

                </label>


                <div class="input-box">

                    <span class="input-icon">

                        🔐

                    </span>


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

            </div>


            <!-- TERMS -->

            <label class="terms">

                <input
                    type="checkbox"
                    name="terms"
                    required
                >

                <span>

                    I agree to the
                    <a href="#">
                        Terms & Conditions
                    </a>
                    and library usage policy.

                </span>

            </label>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-button">

                Create Library Account &nbsp; →

            </button>


        </form>


        <!-- DIVIDER -->

        <div class="divider">

            OR

        </div>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="/login">

                Login here

            </a>

        </div>


        <!-- HOME -->

        <a
            href="/"
            class="back-home">

            ← Back to Home

        </a>


        <!-- SECURITY -->

        <div class="secure">

            🔒 &nbsp; Your information is securely managed

        </div>


    </div>


</div>


</body>

</html>
