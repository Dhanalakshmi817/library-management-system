<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue Books</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)),
                url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2000&q=90");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* MAIN CARD */

        .card {
            width: 850px;
            background: white;

            border-radius: 8px;
            overflow: hidden;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);

            position: relative;
        }

        /* CLOSE BUTTON */

        .close {
            position: absolute;

            top: 15px;
            right: 18px;

            width: 40px;
            height: 40px;

            background: #e74c3c;
            color: white;

            border-radius: 50%;

            text-align: center;
            line-height: 40px;

            text-decoration: none;

            font-size: 26px;
            font-weight: bold;

            z-index: 10;
        }

        .close:hover {
            background: #c0392b;
        }

        /* TITLE */

        .title {
            height: 105px;

            background: #fffdf8;

            border-bottom: 6px solid #f4b45c;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 25px;
        }

        .book-icon {
            font-size: 60px;
        }

        .title h1 {
            color: #1769aa;
            font-size: 30px;
        }

        /* MAIN AREA */

        .main {
            display: flex;
            min-height: 450px;
        }

        /* LEFT SIDE */

        .left {
            width: 42%;

            background: #eeeeee;

            border-right: 7px solid #f4b45c;

            padding: 35px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* STUDENT IMAGE */

        .student-image {
            width: 130px;
            height: 130px;

            object-fit: contain;

            margin-bottom: 25px;
        }

        .enrollment-label {
            font-size: 17px;
            font-weight: bold;

            margin-bottom: 12px;

            color: #222;

            text-align: center;
        }

        .enrollment-input {
            width: 225px;
            height: 38px;

            border: 1px solid #999;
            border-radius: 3px;

            padding: 8px;

            font-size: 15px;
        }

        .enrollment-input:focus {
            outline: none;
            border: 2px solid #2196f3;
        }

        .search-btn {
            width: 185px;

            margin-top: 18px;

            padding: 12px;

            background: #eeeeee;

            border: 2px solid #888;

            border-radius: 4px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .search-btn:hover {
            background: #dddddd;
        }

        .left-buttons {
            display: flex;

            gap: 30px;

            margin-top: auto;
        }

        .refresh-btn,
        .exit-btn {
            padding: 10px 28px;

            border: 1px solid #888;

            background: #eeeeee;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            border-radius: 3px;
        }

        .refresh-btn:hover,
        .exit-btn:hover {
            background: #dddddd;
        }

        /* RIGHT SIDE */

        .right {
            width: 58%;

            background: #bdf3f7;

            padding: 28px 40px;
        }

        .row {
            display: flex;

            align-items: center;

            margin-bottom: 18px;
        }

        .row label {
            width: 190px;

            font-size: 16px;

            color: #222;
        }

        .row input,
        .row select {
            width: 245px;

            height: 34px;

            border: 1px solid #999;

            border-radius: 3px;

            padding: 5px 8px;

            background: white;

            font-size: 14px;
        }

        .row input:focus,
        .row select:focus {
            outline: none;

            border: 2px solid #2196f3;
        }

        .readonly {
            background: #f3f3f3 !important;
        }

        /* ISSUE BUTTON */

        .issue-area {
            text-align: center;

            margin-top: 18px;
        }

        .issue-btn {
            padding: 11px 28px;

            background: #dffcff;

            border: 2px solid #008fa3;

            border-radius: 4px;

            color: #111;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .issue-btn:hover {
            background: #9eeaf0;
        }

        /* MAXIMUM MESSAGE */

        .maximum {
            margin-top: 8px;

            text-align: right;

            color: #e53935;

            font-size: 15px;

            font-weight: bold;
        }

        /* ERROR MESSAGE */

        .error-message {
            display: none;

            margin-top: 12px;

            padding: 9px;

            background: #ffd6d6;

            color: #c0392b;

            border-radius: 4px;

            text-align: center;

            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            body {
                padding: 15px;
                align-items: flex-start;
            }

            .card {
                width: 100%;
            }

            .main {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                border-right: none;
                border-bottom: 7px solid #f4b45c;
                min-height: 400px;
            }

            .row {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            .row label {
                width: 100%;
            }

            .row input,
            .row select {
                width: 100%;
            }

            .left-buttons {
                margin-top: 30px;
            }
        }
    </style>

</head>

<body>

    <body>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        {% if category == "error" %}
        <script>
            alert("{{ message }}");
        </script>
        {% endif %}
        {% endfor %}
        {% endwith %}

        <!-- your existing Issue Book page -->
        <div class="card">

            <!-- CLOSE BUTTON -->

            <a href="/dashboard" class="close">×</a>


            <!-- TITLE -->

            <div class="title">

                <div class="book-icon">
                    📖
                </div>

                <h1>
                    Issue Books
                </h1>

            </div>


            <!-- MAIN -->

            <div class="main">


                <!-- LEFT SIDE -->

                <div class="left">

                    <!-- EXISTING GIRL IMAGE -->

                    <img src="{{ url_for('static', filename='images/girl.png') }}" class="student-image" alt="Student">

                    <label class="enrollment-label">
                        Enter Enrollment NO
                    </label>

                    <input type="text" id="enrollment" class="enrollment-input" placeholder="Enter enrollment no"
                        autocomplete="off">

                    <button type="button" class="search-btn" onclick="searchStudent()">
                        Search Student
                    </button>


                    <div class="left-buttons">

                        <button type="button" class="refresh-btn" onclick="window.location.reload()">
                            Refresh
                        </button>

                        <button type="button" class="exit-btn" onclick="window.location.href='/dashboard'">
                            Exit
                        </button>

                    </div>

                </div>


                <!-- RIGHT SIDE -->

                <div class="right">

                    <form method="POST" action="/issuebook" id="issueForm" onsubmit="return validateIssue()">

                        <!-- STUDENT ID -->

                        <input type="hidden" name="student_id" id="student_id">


                        <!-- STUDENT NAME -->

                        <div class="row">

                            <label>
                                Student Name
                            </label>

                            <input type="text" id="student_name" class="readonly" readonly>

                        </div>


                        <!-- DEPARTMENT -->

                        <div class="row">

                            <label>
                                Department
                            </label>

                            <input type="text" id="department" class="readonly" readonly>

                        </div>


                        <!-- SEMESTER -->

                        <div class="row">

                            <label>
                                Student Semester
                            </label>

                            <input type="text" id="semester" class="readonly" readonly>

                        </div>


                        <!-- CONTACT -->

                        <div class="row">

                            <label>
                                Student Contact
                            </label>

                            <input type="text" id="phone" class="readonly" readonly>

                        </div>


                        <!-- EMAIL -->

                        <div class="row">

                            <label>
                                Student Email
                            </label>

                            <input type="text" id="email" class="readonly" readonly>

                        </div>


                        <!-- BOOK -->

                        <div class="row">

                            <label>
                                Books Name
                            </label>

                            <select name="book_id" id="book_id" required>

                                <option value="">
                                    Select Book
                                </option>

                                {% for book in books %}

                                <option value="{{ book['id'] }}">
                                    {{ book['title'] }} - {{ book['author'] }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- ISSUE DATE -->

                        <div class="row">

                            <label>
                                Book Issue Date
                            </label>

                            <input type="date" name="issue_date" id="issue_date" value="{{ today }}" required>

                        </div>


                        <!-- ERROR MESSAGE -->

                        <div id="errorMessage" class="error-message">
                            Please search and select a student first.
                        </div>


                        <!-- ISSUE BUTTON -->

                        <div class="issue-area">

                            <button type="submit" class="issue-btn">
                                Issue Book
                            </button>

                        </div>


                        <!-- MAXIMUM -->

                        <div class="maximum">
                            Maximum 3 Books Can be ISSUED To 1 Student
                        </div>

                    </form>

                </div>

            </div>

        </div>


        <!-- STUDENT DATA -->

        <script id="student-data" type="application/json">
        {{ students | tojson }}
    </script>


        <!-- JAVASCRIPT -->

        <script>

            const students = JSON.parse(
                document.getElementById("student-data").textContent
            );


            /* SEARCH STUDENT */

            function searchStudent() {

                const enrollment =
                    document.getElementById("enrollment")
                        .value
                        .trim()
                        .toLowerCase();

                const error =
                    document.getElementById("errorMessage");


                if (!enrollment) {

                    clearStudentDetails();

                    error.innerText =
                        "Please enter enrollment number.";

                    error.style.display = "block";

                    return;
                }


                const student = students.find(function (item) {

                    return String(item.enrollment || "")
                        .trim()
                        .toLowerCase() === enrollment;

                });


                if (!student) {

                    clearStudentDetails();

                    error.innerText =
                        "Student not found!";

                    error.style.display = "block";

                    return;
                }


                document.getElementById("student_id").value =
                    student.id || "";

                document.getElementById("student_name").value =
                    student.name || "";

                document.getElementById("department").value =
                    student.department || "";

                document.getElementById("semester").value =
                    student.semester || "";

                document.getElementById("phone").value =
                    student.phone || "";

                document.getElementById("email").value =
                    student.email || "";


                error.style.display = "none";
            }


            /* CLEAR STUDENT DETAILS */

            function clearStudentDetails() {

                document.getElementById("student_id").value = "";

                document.getElementById("student_name").value = "";

                document.getElementById("department").value = "";

                document.getElementById("semester").value = "";

                document.getElementById("phone").value = "";

                document.getElementById("email").value = "";
            }


            /* FORM VALIDATION */

            function validateIssue() {

                const studentId =
                    document.getElementById("student_id").value;

                const bookId =
                    document.getElementById("book_id").value;

                const issueDate =
                    document.getElementById("issue_date").value;

                const error =
                    document.getElementById("errorMessage");


                if (!studentId) {

                    error.innerText =
                        "Please search student first.";

                    error.style.display = "block";

                    return false;
                }


                if (!bookId) {

                    error.innerText =
                        "Please select a book.";

                    error.style.display = "block";

                    return false;
                }


                if (!issueDate) {

                    error.innerText =
                        "Please select issue date.";

                    error.style.display = "block";

                    return false;
                }


                error.style.display = "none";

                return true;
            }


            /* ENTER KEY SEARCH */

            document
                .getElementById("enrollment")
                .addEventListener("keydown", function (event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        searchStudent();
                    }

                });

        </script>

    </body>

</html>
